name: Build SEO pages

on:
  schedule:
    - cron: "0 2 * * *"   # daily, 02:00 UTC = 03:00 Lagos
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_seo.py"
      - ".github/workflows/seo-build.yml"

permissions:
  contents: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pages from Supabase
        run: python scripts/generate_seo.py
      - name: Commit if anything changed
        run: |
          git config user.name "dytronics-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(seo): regenerate product pages and sitemap"
            git pull --rebase origin main
            git push
          fi
