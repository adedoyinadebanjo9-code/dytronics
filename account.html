<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | DYTRONICS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Manage your DYTRONICS account: order history and saved addresses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
  a{color:inherit; text-decoration:none;}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--green); font-weight:600;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 5vw; border-bottom:1px solid var(--line);}
  .wordmark{font-family:'Fraunces',serif; font-weight:500; font-size:15px; letter-spacing:.14em;}
  .topbar .back{font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.75;}
  .topbar .back:hover{opacity:1;}

  .wrap{max-width:520px; margin:0 auto; padding:64px 5vw 100px;}
  .wrap.wide{max-width:760px;}

  h1{font-family:'Fraunces',serif; font-weight:400; font-style:italic; font-size:clamp(28px,5vw,38px); margin:10px 0 8px;}
  .lede{color:var(--ink-soft); font-size:14px; line-height:1.6; margin-bottom:30px;}

  /* ---------- Auth card ---------- */
  .auth-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:36px 32px;}
  .tabs{display:flex; margin-bottom:28px; border-bottom:1px solid var(--line);}
  .tab{flex:1; text-align:center; padding:12px 0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit;}
  .tab.active{color:var(--green); border-bottom-color:var(--green);}

  .field{margin-bottom:18px;}
  .field label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px;}
  .field input[type="text"], .field input[type="email"], .field input[type="password"], .field input[type="tel"]{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:#fff; font:inherit; font-size:14px; color:var(--ink);
  }
  .field input:focus{outline:none; border-color:var(--green);}
  .checkbox-field{display:flex; align-items:center; gap:9px; margin-bottom:20px;}
  .checkbox-field input{width:auto;}
  .checkbox-field label{margin:0; text-transform:none; font-size:13px; letter-spacing:0; color:var(--ink);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:14px 26px; background:var(--green); border:1px solid var(--green);
    color:#f3e9de; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    cursor:pointer; transition:background .25s ease; font-family:inherit;
  }
  .btn:hover{background:var(--green-deep);}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper-deep);}
  .btn-auto{width:auto;}
  .btn-small{padding:9px 16px; font-size:11px;}

  .status-msg{font-size:13px; margin-top:14px; color:var(--ink-soft); min-height:1em;}
  .status-msg.err{color:#a53b3b;}
  .status-msg.ok{color:var(--green);}

  /* ---------- Account console ---------- */
  .acc-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:30px; padding-bottom:22px; border-bottom:1px solid var(--line);}
  .acc-email{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .console-tabs{display:flex; gap:28px; margin-bottom:30px; border-bottom:1px solid var(--line);}
  .console-tab{padding:0 0 14px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit;}
  .console-tab.active{color:var(--green); border-bottom-color:var(--green);}
  .panel{display:none;}
  .panel.active{display:block;}

  #logoutBtn{background:none; border:1px solid var(--line); padding:9px 16px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; color:var(--ink); font-family:inherit;}
  #logoutBtn:hover{background:var(--paper-deep);}

  .order-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px; cursor:pointer;}
  .order-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .order-track{font-family:'Fraunces',serif; font-size:16px;}
  .order-date{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .order-amt{font-size:15px; font-weight:600; text-align:right; white-space:nowrap;}
  .status-badge{display:inline-block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:20px; font-weight:700; margin-top:8px;}
  .st-pending_payment{background:#eee0c2; color:#7a5b16;}
  .st-paid{background:#dbe6de; color:#233128;}
  .st-shipped{background:#dbe0ee; color:#2c3a63;}
  .st-delivered{background:#d8ecd9; color:#245026;}
  .st-cancelled{background:#f0d9d9; color:#7a2b2b;}
  .order-items{margin-top:16px; padding-top:16px; border-top:1px solid var(--line); display:none;}
  .order-card.open .order-items{display:block;}
  .oi-row{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:7px 0;}
  .oi-meta{color:var(--ink-soft); font-size:12px; margin-top:2px;}

  .claim-row{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .claim-row input{flex:1; min-width:160px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); font:inherit; text-transform:uppercase; background:#fff;}

  .divider{border:none; border-top:1px solid var(--line); margin:30px 0;}

  .addr-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px;}
  .addr-label-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .addr-label{font-weight:600; font-size:13px;}
  .default-badge{font-size:10px; letter-spacing:.08em; text-transform:uppercase; background:var(--gold); color:#1a1610; padding:3px 8px; border-radius:20px; font-weight:700;}
  .addr-body{font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px;}
  .addr-actions{display:flex; gap:16px; flex-wrap:wrap;}
  .link-btn{font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--green); cursor:pointer; background:none; border:none; font-weight:600; padding:0; font-family:inherit;}
  .link-btn.danger{color:#a53b3b;}

  .empty-state{font-size:13px; color:var(--ink-soft); padding:20px 0;}

  #addrForm{margin-top:24px; padding-top:24px; border-top:1px solid var(--line);}
  .addr-form-actions{display:flex; gap:10px; flex-wrap:wrap;}

  @media(max-width:640px){ .wrap{padding:40px 5vw 80px;} }
</style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark">DYTRONICS</a>
    <a href="index.html" class="back">&larr; Back to shop</a>
  </header>

  <!-- Logged-out: auth gate -->
  <div class="wrap" id="authWrap">
    <span class="eyebrow">My Account</span>
    <h1 id="authHeading">Sign in</h1>
    <p class="lede">Sign in to view your order history and manage saved addresses.</p>

    <div class="auth-card">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">Sign in</button>
        <button type="button" class="tab" data-tab="signup">Create account</button>
      </div>

      <form id="loginForm">
        <div class="field"><label for="li_email">Email</label><input id="li_email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="li_pass">Password</label><input id="li_pass" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn" id="loginBtn">Sign in</button>
        <p class="status-msg" id="loginStatus"></p>
      </form>

      <form id="signupForm" hidden>
        <div class="field"><label for="su_email">Email</label><input id="su_email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="su_pass">Password</label><input id="su_pass" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label for="su_pass2">Confirm password</label><input id="su_pass2" type="password" autocomplete="new-password" minlength="6" required></div>
        <button type="submit" class="btn" id="signupBtn">Create account</button>
        <p class="status-msg" id="signupStatus"></p>
      </form>
    </div>
  </div>

  <!-- Logged-in: account console -->
  <div class="wrap wide" id="consoleWrap" hidden>
    <div class="acc-head">
      <div>
        <span class="eyebrow">My Account</span>
        <div class="acc-email" id="acEmail"></div>
      </div>
      <button type="button" id="logoutBtn">Sign out</button>
    </div>

    <div class="console-tabs">
      <button type="button" class="console-tab active" data-panel="orders">Order History</button>
      <button type="button" class="console-tab" data-panel="addresses">Addresses</button>
    </div>

    <div class="panel active" id="ordersPanel">
      <div id="ordersList"><p class="empty-state">Loading your orders&hellip;</p></div>

      <hr class="divider">
      <span class="eyebrow">Link a past order</span>
      <p class="lede" style="margin:8px 0 0;">Placed an order before creating an account? Enter its tracking number to add it here.</p>
      <div class="claim-row">
        <input type="text" id="claimInput" placeholder="STV-XXXXXX" maxlength="10" autocomplete="off" spellcheck="false">
        <button type="button" class="btn btn-auto btn-small" id="claimBtn">Add to my account</button>
      </div>
      <p class="status-msg" id="claimStatus"></p>
    </div>

    <div class="panel" id="addressesPanel">
      <div id="addressesList"><p class="empty-state">Loading your addresses&hellip;</p></div>
      <button type="button" class="btn btn-ghost btn-auto btn-small" id="showAddAddrBtn">+ Add new address</button>

      <form id="addrForm" hidden>
        <input type="hidden" id="addr_id">
        <div class="field"><label for="addr_label">Label</label><input id="addr_label" type="text" placeholder="Home, Office&hellip;" required></div>
        <div class="field"><label for="addr_name">Full name</label><input id="addr_name" type="text" autocomplete="name" required></div>
        <div class="field"><label for="addr_phone">Phone number</label><input id="addr_phone" type="tel" autocomplete="tel" required></div>
        <div class="field"><label for="addr_address">Address</label><input id="addr_address" type="text" autocomplete="street-address" placeholder="Street, area, city, state" required></div>
        <div class="checkbox-field">
          <input type="checkbox" id="addr_default">
          <label for="addr_default">Set as default address</label>
        </div>
        <div class="addr-form-actions">
          <button type="submit" class="btn btn-auto btn-small" id="addrSaveBtn">Save address</button>
          <button type="button" class="btn btn-ghost btn-auto btn-small" id="addrCancelBtn">Cancel</button>
        </div>
        <p class="status-msg" id="addrStatus"></p>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

// Same project/key index.html uses — public/anon key only, safe client-side.
const SUPABASE_URL = "https://oqlbtbdmobhgxpqbyaeq.supabase.co";
const SUPABASE_KEY = "sb_publishable_wS7kpnC5GOcHNkgEhbp1eQ_ND2DxAnN";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtNaira(n) { return '\u20a6' + Number(n || 0).toLocaleString('en-NG'); }
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch (e) { return iso; }
}
const STATUS_LABEL = { pending_payment: 'Pending payment', paid: 'Paid', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
function statusBadge(status) {
  const label = STATUS_LABEL[status] || status;
  const cls = STATUS_LABEL[status] ? status : 'pending_payment';
  return `<span class="status-badge st-${escapeHtml(cls)}">${escapeHtml(label)}</span>`;
}

/* ---------------- Auth tab switching ---------------- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.tab === 'login';
    $('loginForm').hidden = !isLogin;
    $('signupForm').hidden = isLogin;
    $('authHeading').textContent = isLogin ? 'Sign in' : 'Create your account';
  });
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('li_email').value.trim();
  const password = $('li_pass').value;
  const status = $('loginStatus');
  status.textContent = 'Signing in\u2026'; status.className = 'status-msg';
  $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('loginBtn').disabled = false;
  if (error) { status.textContent = error.message || 'Sign-in failed.'; status.className = 'status-msg err'; return; }
  status.textContent = '';
  enterConsole();
});

$('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('su_email').value.trim();
  const password = $('su_pass').value;
  const password2 = $('su_pass2').value;
  const status = $('signupStatus');
  status.className = 'status-msg';
  if (password !== password2) { status.textContent = "Passwords don't match."; status.className = 'status-msg err'; return; }
  if (password.length < 6) { status.textContent = 'Password must be at least 6 characters.'; status.className = 'status-msg err'; return; }
  status.textContent = 'Creating your account\u2026';
  $('signupBtn').disabled = true;
  const { data, error } = await sb.auth.signUp({ email, password });
  $('signupBtn').disabled = false;
  if (error) { status.textContent = error.message || 'Could not create account.'; status.className = 'status-msg err'; return; }
  if (data.session) {
    status.textContent = '';
    enterConsole();
  } else {
    // Email confirmation is turned on in Supabase Auth settings — no
    // session yet until they click the link in their inbox.
    status.textContent = 'Check your email to confirm your account, then sign in.';
    status.className = 'status-msg ok';
  }
});

$('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  showAuthGate();
});

function showAuthGate() {
  $('consoleWrap').hidden = true;
  $('authWrap').hidden = false;
}

async function enterConsole() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { showAuthGate(); return; }
  $('authWrap').hidden = true;
  $('consoleWrap').hidden = false;
  $('acEmail').textContent = user.email;
  loadOrders();
  loadAddresses();
}

/* ---------------- Console tab switching ---------------- */
document.querySelectorAll('.console-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.console-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $(tab.dataset.panel + 'Panel').classList.add('active');
  });
});

/* ---------------- Order history ---------------- */
async function loadOrders() {
  const list = $('ordersList');
  list.innerHTML = '<p class="empty-state">Loading your orders\u2026</p>';
  const { data, error } = await sb.rpc('get_my_dytronics_orders');
  if (error) {
    console.error('get_my_dytronics_orders failed:', error);
    list.innerHTML = '<p class="empty-state">Couldn\u2019t load your orders \u2014 please refresh and try again.</p>';
    return;
  }
  if (!data || !data.length) {
    list.innerHTML = '<p class="empty-state">No orders linked to this account yet. Placed one as a guest? Link it below with your tracking number.</p>';
    return;
  }
  list.innerHTML = data.map(orderCardHtml).join('');
  list.querySelectorAll('.order-card').forEach(card => {
    card.addEventListener('click', () => card.classList.toggle('open'));
  });
}

function orderCardHtml(o) {
  const items = o.items || [];
  const itemsHtml = items.map(it => `
    <div class="oi-row">
      <div>${escapeHtml(it.product_name)}<div class="oi-meta">${it.variant ? escapeHtml(it.variant) + ' \u00b7 ' : ''}Qty ${escapeHtml(String(it.quantity))}</div></div>
      <div>${fmtNaira(it.subtotal)}</div>
    </div>`).join('');
  return `
    <div class="order-card" data-id="${o.id}">
      <div class="order-card-top">
        <div>
          <div class="order-track">${escapeHtml(o.tracking_number)}</div>
          <div class="order-date">${escapeHtml(fmtDate(o.created_at))}</div>
          ${statusBadge(o.status)}
        </div>
        <div class="order-amt">${fmtNaira(o.amount_total)}</div>
      </div>
      <div class="order-items">${itemsHtml}</div>
    </div>`;
}

$('claimBtn').addEventListener('click', async () => {
  const input = $('claimInput');
  const tn = input.value.trim().toUpperCase();
  const status = $('claimStatus');
  if (!tn) return;
  status.className = 'status-msg'; status.textContent = 'Linking\u2026';
  $('claimBtn').disabled = true;
  try {
    const { data, error } = await sb.rpc('claim_dytronics_order', { p_tracking_number: tn });
    if (error) throw error;
    if (data === true) {
      status.textContent = 'Order linked to your account.';
      status.className = 'status-msg ok';
      input.value = '';
      loadOrders();
    } else {
      status.textContent = 'Couldn\u2019t find an unlinked order with that tracking number.';
      status.className = 'status-msg err';
    }
  } catch (err) {
    status.textContent = 'Something went wrong \u2014 please try again.';
    status.className = 'status-msg err';
    console.error('claim_dytronics_order failed:', err);
  }
  $('claimBtn').disabled = false;
});

/* ---------------- Addresses ---------------- */
async function loadAddresses() {
  const list = $('addressesList');
  list.innerHTML = '<p class="empty-state">Loading your addresses\u2026</p>';
  const { data, error } = await sb
    .from('dytronics_addresses')
    .select('*')
    .order('is_default', { ascending: false })
    .order('created_at', { ascending: false });
  if (error) {
    console.error('Address load failed:', error);
    list.innerHTML = '<p class="empty-state">Couldn\u2019t load your addresses \u2014 please refresh and try again.</p>';
    return;
  }
  if (!data || !data.length) {
    list.innerHTML = '<p class="empty-state">No saved addresses yet.</p>';
    return;
  }
  list.innerHTML = data.map(addressCardHtml).join('');
  wireAddressActions();
}

function addressCardHtml(a) {
  return `
    <div class="addr-card" data-id="${a.id}">
      <div class="addr-label-row">
        <span class="addr-label">${escapeHtml(a.label)}</span>
        ${a.is_default ? '<span class="default-badge">Default</span>' : ''}
      </div>
      <div class="addr-body">${escapeHtml(a.full_name)}<br>${escapeHtml(a.phone)}<br>${escapeHtml(a.address)}</div>
      <div class="addr-actions">
        ${a.is_default ? '' : `<button type="button" class="link-btn" data-action="default" data-id="${a.id}">Set as default</button>`}
        <button type="button" class="link-btn" data-action="edit" data-id="${a.id}">Edit</button>
        <button type="button" class="link-btn danger" data-action="delete" data-id="${a.id}">Delete</button>
      </div>
    </div>`;
}

function wireAddressActions() {
  document.querySelectorAll('.addr-card [data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (action === 'delete') {
        if (!confirm('Delete this address?')) return;
        await sb.from('dytronics_addresses').delete().eq('id', id);
        loadAddresses();
      } else if (action === 'default') {
        const { data: { user } } = await sb.auth.getUser();
        await sb.from('dytronics_addresses').update({ is_default: false }).eq('customer_id', user.id);
        await sb.from('dytronics_addresses').update({ is_default: true }).eq('id', id);
        loadAddresses();
      } else if (action === 'edit') {
        const { data } = await sb.from('dytronics_addresses').select('*').eq('id', id).single();
        if (data) openAddrForm(data);
      }
    });
  });
}

function openAddrForm(existing) {
  $('addrForm').hidden = false;
  $('addr_id').value = existing ? existing.id : '';
  $('addr_label').value = existing ? existing.label : '';
  $('addr_name').value = existing ? existing.full_name : '';
  $('addr_phone').value = existing ? existing.phone : '';
  $('addr_address').value = existing ? existing.address : '';
  $('addr_default').checked = existing ? !!existing.is_default : false;
  $('addrStatus').textContent = '';
  $('addrForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('showAddAddrBtn').addEventListener('click', () => openAddrForm(null));
$('addrCancelBtn').addEventListener('click', () => { $('addrForm').hidden = true; $('addrForm').reset(); });

$('addrForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = $('addrStatus'); status.className = 'status-msg';
  const id = $('addr_id').value;
  const payload = {
    label: $('addr_label').value.trim(),
    full_name: $('addr_name').value.trim(),
    phone: $('addr_phone').value.trim(),
    address: $('addr_address').value.trim(),
    is_default: $('addr_default').checked
  };
  if (!payload.label || !payload.full_name || !payload.phone || !payload.address) {
    status.textContent = 'Please fill in every field.'; status.className = 'status-msg err'; return;
  }
  $('addrSaveBtn').disabled = true;
  status.textContent = 'Saving\u2026';
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (payload.is_default) {
      await sb.from('dytronics_addresses').update({ is_default: false }).eq('customer_id', user.id);
    }
    if (id) {
      const { error } = await sb.from('dytronics_addresses').update(payload).eq('id', id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('dytronics_addresses').insert({ ...payload, customer_id: user.id });
      if (error) throw error;
    }
    $('addrForm').hidden = true; $('addrForm').reset();
    loadAddresses();
  } catch (err) {
    status.textContent = err.message || 'Could not save this address.';
    status.className = 'status-msg err';
    console.error('Address save failed:', err);
  }
  $('addrSaveBtn').disabled = false;
});

/* ---------------- Boot ---------------- */
sb.auth.getSession().then(({ data }) => {
  if (data.session) enterConsole(); else showAuthGate();
});
sb.auth.onAuthStateChange((_event, session) => {
  if (!session) showAuthGate();
});

})();
</script>
</body>
</html>
